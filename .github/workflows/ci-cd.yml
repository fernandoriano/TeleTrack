name: TeleTrack CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: backend
        run: |
          python -m compileall app


  processor:
    name: Validate Processor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install processor dependencies
        working-directory: processor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate processor
        working-directory: processor
        run: |
          python -m py_compile main.py


  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  mobile:
    name: Validate Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test


  docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - processor
      - frontend
      - mobile

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/teletrack-api:latest \
            ./backend

      - name: Push API image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/teletrack-api:latest

      - name: Build Processor image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/teletrack-processor:latest \
            ./processor

      - name: Push Processor image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/teletrack-processor:latest

      - name: Build Frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/teletrack-frontend:latest \
            ./frontend

      - name: Push Frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/teletrack-frontend:latest


  deploy:
    name: Deploy to Azure K3s
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AZURE_SSH_KEY }}" > ~/.ssh/teletrack_key
          chmod 600 ~/.ssh/teletrack_key

      - name: Deploy TeleTrack to Azure
        run: |
          ssh \
            -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/teletrack_key \
            "${{ secrets.AZURE_USER }}@${{ secrets.AZURE_HOST }}" << 'EOF'

            set -e

            echo "======================================"
            echo " TeleTrack automatic deployment"
            echo "======================================"

            cd ~/TeleTrack

            echo "Updating repository..."
            git pull origin main

            echo "Applying Kubernetes manifests..."
            sudo kubectl apply -f k8s/namespace.yaml
            sudo kubectl apply -f k8s/database.yaml

            echo "Waiting for PostgreSQL..."
            sudo kubectl rollout status statefulset/database \
              -n teletrack \
              --timeout=180s

            echo "Running database migrations..."
            sudo kubectl delete job teletrack-migrate \
              -n teletrack \
              --ignore-not-found=true

            sudo kubectl apply -f k8s/migrate-job.yaml

            sudo kubectl wait \
              --for=condition=complete \
              job/teletrack-migrate \
              -n teletrack \
              --timeout=180s

            echo "Applying application manifests..."
            sudo kubectl apply -f k8s/api.yaml
            sudo kubectl apply -f k8s/processor.yaml
            sudo kubectl apply -f k8s/frontend.yaml
            sudo kubectl apply -f k8s/autoscaling.yaml

            echo "Restarting application deployments..."
            sudo kubectl rollout restart deployment/api \
              -n teletrack

            sudo kubectl rollout restart deployment/processor \
              -n teletrack

            sudo kubectl rollout restart deployment/frontend \
              -n teletrack

            echo "Waiting for API..."
            sudo kubectl rollout status deployment/api \
              -n teletrack \
              --timeout=240s

            echo "Waiting for Processor..."
            sudo kubectl rollout status deployment/processor \
              -n teletrack \
              --timeout=240s

            echo "Waiting for Frontend..."
            sudo kubectl rollout status deployment/frontend \
              -n teletrack \
              --timeout=240s

            echo "======================================"
            echo " Deployment completed successfully"
            echo "======================================"

            sudo kubectl get pods -n teletrack
            sudo kubectl get hpa -n teletrack

          EOF
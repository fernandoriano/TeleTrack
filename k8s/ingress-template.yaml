apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teletrack
  namespace: teletrack

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - ${TELETRACK_HOST}

      secretName: teletrack-tls

  rules:
    - host: ${TELETRACK_HOST}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend

                port:
                  number: 80
                  